<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="Pizarra de fútbol 5: mueve a los jugadores y Pambol te dice qué hacer en el siguiente segundo.">
<title>Pambol</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Crect x='7' y='7' width='18' height='18' rx='4' fill='%23d97a00'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff9f0a'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='none' stroke='%23fff6ea' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
/* Pambol. Lenguaje de app de Apple en modo oscuro: tipografía del sistema, materiales translúcidos sobre un fondo
   que se tiñe con los colores de los dos equipos (rival arriba, el mío abajo). Cancha plana, sin luz simulada.
   Radios: controles 12px, segmentos 9px, hoja 28px. Un acento: naranja = lo que tú haces. */
/* --mine y --rival se animan al cambiar la equipación (el degradado del fondo los usa) */
@property --mine{syntax:'<color>';inherits:true;initial-value:#d8263b}
@property --rival{syntax:'<color>';inherits:true;initial-value:#5cb8ec}
:root{
  --night:#0a0a0c;
  --sheet:rgba(30,30,32,.72); --sheet-solid:#1e1e20;
  --sheet-2:rgba(118,118,128,.24); --sheet-3:rgba(118,118,128,.42); --thumb:#5b5b60;
  --line:rgba(84,84,88,.6);
  --ink:#f5f5f7; --ink-2:rgba(235,235,245,.7); --ink-3:rgba(235,235,245,.56);
  --cone:#ff9f0a; --cone-2:#ffb340; --cone-ink:#1f1300;
  --miss:#ff453a;
  --mine:#d8263b; --rival:#5cb8ec;   /* se recalculan desde la equipación de cada equipo */
  --r-ctl:12px; --r-sheet:28px;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --cond:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --material:blur(30px) saturate(180%);
  --peek:212px;
  color-scheme:dark;
  transition:--mine 500ms ease,--rival 500ms ease;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--night);
  /* los colores de los equipos tiñen la noche: el rival desde arriba, el mío desde abajo */
  background-image:
    radial-gradient(120% 60% at 10% -12%, color-mix(in oklab, var(--rival) 52%, transparent), transparent 68%),
    radial-gradient(120% 60% at 90% 112%, color-mix(in oklab, var(--mine) 52%, transparent), transparent 68%),
    linear-gradient(180deg, color-mix(in oklab, var(--rival) 10%, var(--night)), var(--night) 45%, color-mix(in oklab, var(--mine) 10%, var(--night)));
  color:var(--ink);font:400 16px/1.45 var(--body);letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;
}
::selection{background:color-mix(in oklab, var(--cone) 45%, transparent)}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--cone);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:currentColor}

.app{position:relative;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top)}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px 6px;position:relative;z-index:3}
.word{font:800 28px/1 var(--cond);letter-spacing:-.035em;margin:0;padding-right:2px}
.who{margin-left:auto;display:flex;align-items:center;gap:6px}
.who span{font-size:14px;color:var(--ink-2);margin-right:4px;white-space:nowrap}
/* Las camisetas se pintan desde la configuración de cada equipo: --kit (fondo), --ring (contorno), --ink/--halo (dorsal). */
.kit{--ring:rgba(0,0,0,.35);width:38px;height:38px;border-radius:50%;position:relative;display:grid;place-items:center;
  font:700 15px/1 var(--cond);letter-spacing:-.02em;color:var(--ink-k,#fff);text-shadow:0 0 2px var(--halo,rgba(40,4,10,.7)),0 0 3px var(--halo,rgba(40,4,10,.55));
  background:var(--kit,var(--mine));
  box-shadow:inset 0 0 0 3px var(--ring),inset 0 0 0 4px rgba(0,0,0,.25);
  transition:transform 160ms var(--ease-out),box-shadow 200ms ease}
.kit:active{transform:scale(.94)}
.kit[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ring),inset 0 0 0 4px rgba(0,0,0,.25),0 0 0 2px var(--night),0 0 0 4px var(--cone)}

/* ---------- escenario ---------- */
.stage{position:relative;min-height:0;overflow:hidden}
.pitch-wrap{position:absolute;inset:0 0 calc(var(--peek) - 2px) 0;padding:2px 10px 6px;display:flex;justify-content:center}
#pitch{height:100%;width:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;overflow:visible}
.stage.picking #pitch{cursor:crosshair}

/* material translúcido para todo lo que flota sobre la cancha */
.hint,.toast,.sheet{-webkit-backdrop-filter:var(--material);backdrop-filter:var(--material)}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);
  padding:8px 8px 8px 16px;border-radius:999px;background:rgba(44,44,46,.66);font-size:14px;font-weight:500;color:var(--ink);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.3);line-height:1.3;transition:opacity 200ms ease,transform 200ms var(--ease-out)}
.hint button{flex:none;height:30px;padding:0 14px;border-radius:999px;background:var(--sheet-3);font-size:14px;font-weight:600}
.hint.gone{opacity:0;transform:translate(-50%,-6px);pointer-events:none}

.toast{position:absolute;z-index:2;pointer-events:none;padding:7px 12px;border-radius:999px;background:rgba(44,44,46,.72);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.28);
  font:600 13px/1.1 var(--body);color:var(--ink);white-space:nowrap;transform:translate(-50%,6px);opacity:0;
  transition:opacity 160ms ease,transform 200ms var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--cone-2);font-weight:700}

/* ---------- hoja inferior ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:6px 20px calc(16px + env(safe-area-inset-bottom));box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 -12px 40px rgba(0,0,0,.3);
  max-height:78dvh;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--sheet-3) transparent}
.grab{display:block;width:100%;height:20px;position:relative}
.grab::before{content:"";position:absolute;left:50%;top:7px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(235,235,245,.3)}
.meta{display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:500;color:var(--ink-2)}
.meta .tag{margin-left:auto;font-size:13px;color:var(--ink-3)}
.meta .tag.rule{color:var(--cone-2)}
.title{font:700 23px/1.12 var(--body);letter-spacing:-.025em;margin:4px 0 2px;text-wrap:balance}
.title small{display:block;font:400 16px/1.25 var(--body);letter-spacing:-.015em;color:var(--ink-2);margin-top:3px}
.figs{display:flex;align-items:flex-end;gap:16px;margin:10px 0 14px}
.hero-n{font:700 44px/.9 var(--cond);letter-spacing:-.04em;color:var(--ink);white-space:nowrap}
.hero-n small{font-size:.45em;font-weight:600;letter-spacing:-.01em;margin-left:4px;color:var(--ink-2)}
.hero-l{font-size:14px;color:var(--ink-2);line-height:1.3;padding-bottom:3px}
.hero-l b{color:var(--ink);font-weight:600}
.hero-l .bad{color:var(--miss)}
.acts{display:flex;gap:8px;align-items:center}
.go{flex:1;height:50px;border-radius:var(--r-ctl);background:var(--cone);color:var(--cone-ink);display:flex;align-items:center;justify-content:center;gap:8px;
  font:600 17px/1 var(--body);letter-spacing:-.02em;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.go:active{transform:scale(.97)}
.sq{width:50px;height:50px;border-radius:var(--r-ctl);background:var(--sheet-2);display:grid;place-items:center;color:var(--ink);
  transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.sq:active{transform:scale(.95)}
.sq[aria-pressed="true"]{background:var(--sheet-3);color:var(--cone-2)}
.sq:disabled{opacity:.3;cursor:default}
.txt{height:50px;padding:0 16px;border-radius:var(--r-ctl);background:var(--sheet-2);font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;
  transition:transform 160ms var(--ease-out),background-color 160ms ease}
.txt:active{transform:scale(.97)}
.txt[aria-pressed="true"]{background:var(--sheet-3);color:var(--cone-2)}
@media (hover:hover) and (pointer:fine){
  .go:hover{background:var(--cone-2)} .sq:not(:disabled):hover,.txt:hover{background:var(--sheet-3)} .kit:hover{transform:scale(1.06)}
}
.why{margin:14px 0 0;color:var(--ink-2);font-size:15px;line-height:1.45;max-width:52ch;text-wrap:pretty}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--ease-out)}
.sheet.open .more{grid-template-rows:1fr}
.more > div{overflow:hidden}
.notes{display:grid;gap:10px;margin:14px 0 2px;padding-top:14px;border-top:.5px solid var(--line)}
.note{margin:0;display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:15px;color:var(--ink-2)}
.note b{font:600 15px/1.35 var(--body);color:var(--ink)}
.note.avoid b{color:var(--miss)} .note.next b{color:var(--cone-2)}
.how{margin:14px 0 0;font-size:13px;color:var(--ink-3)}
.morebtn{display:flex;align-items:center;gap:6px;margin-top:10px;height:32px;font-size:15px;font-weight:500;color:var(--cone-2)}
.morebtn .ico{width:14px;height:14px;transition:transform 240ms var(--ease-out)}
.sheet:not(.open) .morebtn .ico{transform:rotate(180deg)}

/* ---------- panel: jugadas y equipos ---------- */
.sethead{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.sethead .title{margin:0}
.sethead .txt{margin-left:auto;height:34px;padding:0 14px;border-radius:999px;color:var(--cone-2)}
/* control segmentado al estilo iOS: pista gris y una pastilla elevada para lo elegido */
.tabs,.seg{display:grid;gap:2px;padding:2px;border-radius:11px;background:var(--sheet-2)}
.tabs{grid-template-columns:repeat(4,1fr);margin-bottom:18px}
.seg{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tab{white-space:nowrap}
.tab,.seg button{height:34px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background-color 200ms ease,box-shadow 200ms ease,transform 160ms var(--ease-out)}
.seg button{height:40px}
.tab:active,.seg button:active{transform:scale(.96)}
.tab[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--thumb);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:var(--kit);box-shadow:inset 0 0 0 2px var(--ring),0 0 0 .5px rgba(0,0,0,.4)}
.plays{list-style:none;margin:0;padding:0;border-radius:var(--r-ctl);background:var(--sheet-2);overflow:hidden}
.plays li + li .play::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--line)}
.play{position:relative;width:100%;min-height:48px;padding:0 16px;display:flex;align-items:center;gap:12px;text-align:left;
  transition:background-color 160ms ease}
.play:active{background:var(--sheet-3)}
.play b{font-weight:400;font-size:16px;color:var(--ink)}
.play span{margin-left:auto;font-size:15px;color:var(--ink-3);white-space:nowrap}
.play[aria-pressed="true"] b{color:var(--cone-2);font-weight:600}
.grp{margin:0 0 18px;padding:0;border:0;min-width:0}
.grp legend{padding:0 0 0 4px;margin:0 0 7px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button small{font-size:12px;font-weight:400;color:var(--ink-2)}
/* camiseta: vista previa + 7 estilos en una rejilla de 4 x 2 */
.seg.styles{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr))}
.styles .prev{display:grid;place-items:center}
.styles .prev svg{width:44px;height:44px;overflow:visible}
.seg button.stl{flex-direction:column;gap:4px;height:56px;font-size:12px}
.stl .dot{width:20px;height:20px}
/* 10 colores en 5 x 2: cada muestra conserva un blanco de toque cómodo */
.sws{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 0;justify-items:center}
.sw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform 160ms var(--ease-out)}
.sw i{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);transition:box-shadow 160ms ease}
.sw:active{transform:scale(.92)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2.5px var(--sheet-solid),0 0 0 4.5px var(--ink)}
.surfs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.surf{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:6px 6px 9px;border-radius:var(--r-ctl);background:var(--sheet-2);
  font-size:13px;font-weight:500;color:var(--ink);transition:transform 160ms var(--ease-out),box-shadow 160ms ease}
.surf i{height:46px;border-radius:7px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.surf:active{transform:scale(.97)}
.surf[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);font-weight:600}
.clash{margin:-8px 0 18px;padding-left:4px;font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.clash::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--miss);transform:translateY(-1px)}
@media (hover:hover) and (pointer:fine){
  .tab:not([aria-selected="true"]):hover,.seg button:not([aria-pressed="true"]):hover{background:rgba(118,118,128,.18)} .play:hover{background:rgba(118,118,128,.14)} .sw:hover{transform:scale(1.06)}
}

/* repetición */
.pb-row{display:flex;align-items:baseline;gap:14px;margin:2px 0 6px}
.clock{font:700 42px/.95 var(--cond);letter-spacing:-.04em;color:var(--ink);min-width:3.4ch}
.cap{font:600 17px/1.2 var(--body);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.cap.in{animation:capIn 220ms var(--ease-out)}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrub{position:relative;height:34px;margin:2px 0 10px}
.scrub input{position:absolute;inset:10px 0 auto;width:100%;margin:0;height:14px;-webkit-appearance:none;appearance:none;background:transparent}
.scrub input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cone) var(--p,0%),rgba(120,120,128,.36) var(--p,0%))}
.scrub input::-moz-range-track{height:4px;border-radius:2px;background:rgba(120,120,128,.36)}
.scrub input::-moz-range-progress{height:4px;background:var(--cone)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),0 .5px 2px rgba(0,0,0,.2)}
.scrub input::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{position:absolute;top:24px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink-3)}
.evs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:15px}
.evs li{display:grid;grid-template-columns:52px 1fr;color:var(--ink-3);transition:color 200ms ease}
.evs li.on{color:var(--ink)}
.evs li span{font:600 15px/1.4 var(--cond);letter-spacing:-.02em}
.evs li.on span{color:var(--cone-2)}

/* ---------- SVG ---------- */
.tok{cursor:grab}
.tok .body{transform-box:fill-box;transform-origin:center;transition:transform 260ms cubic-bezier(0.34,1.36,0.64,1)}
.tok.lift .body{transform:scale(1.12);transition:transform 160ms var(--ease-out)}
.tok.lift{cursor:grabbing}
#pitch text{letter-spacing:0}   /* el tracking heredado se redondea mal en un SVG escalado */
.n{font:700 1px var(--cond);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.svgchip text{font:600 .66px var(--body);dominant-baseline:central}
.tip{cursor:grab}
.roll{animation:roll .9s linear infinite}
@keyframes roll{to{stroke-dashoffset:-.9}}
.dropin{animation:dropin 300ms var(--ease-out) both}
@keyframes dropin{from{opacity:0;transform:translateY(-.7px) scale(.9)}to{opacity:1;transform:none}}
.step{animation:step 200ms var(--ease-out) both}
@keyframes step{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.step,.dropin{transform-box:fill-box;transform-origin:center}
.ballup{transform-box:fill-box;transform-origin:center;animation:hop 700ms ease-in-out infinite alternate}
@keyframes hop{from{transform:scale(1)}to{transform:scale(1.22)}}
.expo{mix-blend-mode:screen}

@media (prefers-reduced-motion:reduce){
  .roll,.ballup{animation:none}
  .dropin,.step{animation:fadeIn 160ms ease both}
  .cap.in{animation:fadeIn 160ms ease}
  .tok .body,.tok.lift .body{transition:none}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* sin transparencias: materiales sólidos */
@media (prefers-reduced-transparency:reduce){
  :root{--sheet:#1e1e20}
  .hint,.toast,.sheet{-webkit-backdrop-filter:none;backdrop-filter:none}
  .hint,.toast{background:#2c2c2e}
}

/* ---------- escritorio ---------- */
@media (min-width:960px){
  .top{padding:18px 28px 8px}
  .word{font-size:32px}
  body{background-image:
    /* anclados sobre cada portería: el rival detrás de la de arriba, el mío detrás de la de abajo */
    radial-gradient(60% 55% at 35% -8%, color-mix(in oklab, var(--rival) 50%, transparent), transparent 70%),
    radial-gradient(60% 55% at 35% 108%, color-mix(in oklab, var(--mine) 50%, transparent), transparent 70%),
    linear-gradient(180deg, color-mix(in oklab, var(--rival) 10%, var(--night)), var(--night) 50%, color-mix(in oklab, var(--mine) 10%, var(--night)))}
  .pitch-wrap{inset:0 436px 0 0;padding:8px 24px 24px}
  .sheet{left:auto;right:28px;top:8px;bottom:auto;width:384px;border-radius:24px;padding:12px 24px 22px;max-height:calc(100% - 32px);
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.35)}
  .grab{display:none}
  .hint{left:calc((100% - 436px) / 2)}
  .title{font-size:26px}
  .more{grid-template-rows:1fr}
  .morebtn{display:none}
}
@media (max-width:400px){ .who span{display:none} }
@media (max-width:350px){ .kit{width:32px;height:32px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="word">pambol</h1>
    <nav class="who" aria-label="Elige qué jugador eres"><span>Tú eres</span><div id="kits" style="display:flex;gap:6px"></div></nav>
  </header>
  <main class="stage" id="stage">
    <div class="pitch-wrap">
      <svg id="pitch" viewBox="-2 -2 24 44" role="img" aria-label="Cancha de fútbol 5 de noche con los diez jugadores">
        <defs>
          <clipPath id="tokClip"><circle r=".84"/></clipPath>
          <pattern id="net" width=".32" height=".32" patternUnits="userSpaceOnUse"><path d="M0 0L.32 .32M.32 0L0 .32" stroke="rgba(255,255,255,.4)" stroke-width=".025"/></pattern>
        </defs>
        <g id="field"></g>
        <g id="zones"></g>
        <g id="expo" class="expo"></g>
        <g id="marks"></g>
        <g id="rec"></g>
        <g id="arrows"></g>
        <g id="players"></g>
        <g id="coneL"></g>
        <g id="tips"></g>
        <g id="ballG"></g>
        <g id="fx"></g>
      </svg>
    </div>
    <div class="hint" id="hint">Arrastra jugadores y sus flechas. Toca la pelota para pasarla. <button id="hintOk">Va</button></div>
    <section class="sheet" id="sheet" aria-live="polite"></section>
  </main>
</div>

<script>
'use strict';
/* =========================================================
   CONFIG: todos los parámetros de física y puntuación
   ========================================================= */
const CONFIG = {
  speeds: { parado: 0, trote: 3, media: 5, sprint: 7 },             // m/s
  speedOrder: ['parado', 'trote', 'media', 'sprint'],
  speedLabel: { parado: 'Parado', trote: 'Trote', media: 'Media', sprint: 'Sprint' },
  arrowLen: { parado: 1.5, trote: 2.2, media: 3.3, sprint: 4.6 },    // m (dibujo)
  intensity: {
    1: { react: 0.6, vmax: 5.5, label: 'Relajado' },

/* =========================================================
   Utilidades
   ========================================================= */
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }),
  len: a => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  unit: a => { const l = Math.hypot(a.x, a.y); return l > 1e-9 ? { x: a.x / l, y: a.y / l } : { x: 0, y: 0 }; },
  dot: (a, b) => a.x * b.x + a.y * b.y,
  lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }),
  toward: (a, b, d) => { const v = { x: b.x - a.x, y: b.y - a.y }, l = Math.hypot(v.x, v.y); return l <= d ? { x: b.x, y: b.y } : { x: a.x + v.x * d / l, y: a.y + v.y * d / l }; },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clampPitch = (p, m = 0.6) => ({ x: clamp(p.x, m, 20 - m), y: clamp(p.y, m, 40 - m) });
const fmt = (n, d = 1) => (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const pct = p => Math.round(p * 100) + ' %';
const clone = o => JSON.parse(JSON.stringify(o));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function segDist(p, a, b) {
  const ab = V.sub(b, a), t = clamp(V.dot(V.sub(p, a), ab) / Math.max(1e-9, V.dot(ab, ab)), 0, 1);
  return V.dist(p, V.add(a, V.mul(ab, t)));
}
function inTriangle(p, a, b, c) {
  const s = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
  const d1 = s(p, a, b), d2 = s(p, b, c), d3 = s(p, c, a);
  return !(((d1 < 0) || (d2 < 0) || (d3 < 0)) && ((d1 > 0) || (d2 > 0) || (d3 > 0)));
}

}

const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function lum(h) { const c = hexRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const mix = (a, b, t) => '#' + hexRgb(a).map((v, i) => Math.round(v + (hexRgb(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
/* El dorsal pisa uno o dos colores según el estilo: se elige blanco o tinta oscura, la que mejor se lea sobre el peor de ellos,
   con un halo del tono contrario. */
const INK_LIGHT = '#ffffff', INK_DARK = '#10171a';
function kitColors(teamId, gk) { const k = kits[teamId]; return gk ? { base: GK_COLOR[teamId], ring: k.ring, style: 'lisa' } : k; }
function dorsalInk(k) {
  const under = k.style === 'lisa' ? [k.base] : [k.base, k.ring];
  const score = ink => Math.min(...under.map(c => contrast(ink, c)));
  const light = score(INK_LIGHT) >= score(INK_DARK), worst = score(light ? INK_LIGHT : INK_DARK);
  // el halo solo engorda cuando hace falta: fino si la tinta ya contrasta, más grueso sobre colores difíciles
  return { ink: light ? INK_LIGHT : INK_DARK, halo: light ? 'rgba(8,12,14,.72)' : 'rgba(255,255,255,.6)', w: worst >= 4.5 ? 0.06 : worst >= 3 ? 0.11 : 0.16 };
}
function kitCss(k) {
  const { base: a, ring: b } = k;
  // franjas de 1/6 del ancho con el centro en el color base, como en las fichas
  const bars = deg => `linear-gradient(${deg}deg,${b} 0 8.33%,${a} 8.33% 25%,${b} 25% 41.67%,${a} 41.67% 58.33%,${b} 58.33% 75%,${a} 75% 91.67%,${b} 91.67%)`;
  return k.style === 'rayas' ? bars(90) : k.style === 'bandas' ? bars(180)
    : k.style === 'mitades' ? `linear-gradient(90deg,${a} 50%,${b} 50%)`
    : SHAPES[k.style] ? `url('data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -1 2 2' preserveAspectRatio='none'><rect x='-1' y='-1' width='2' height='2' fill='${a}'/><path d='${SHAPES[k.style]}' fill='${b}'/></svg>`).replace(/'/g, '%27')}') center/100% 100%` : a;
}
const kitVars = k => { const d = dorsalInk(k); return `--kit:${kitCss(k)};--ring:${k.ring};--ink-k:${d.ink};--halo:${d.halo}`; };
// color de la estela y de las zonas: el más visible de los dos sobre la noche
const teamGlow = teamId => { const k = kits[teamId]; return lum(k.base) < 0.05 && lum(k.ring) > lum(k.base) ? k.ring : k.base; };
// equipos que se confunden con la superficie elegida
function surfaceClash() {
  const sf = surfById(surface), ground = sf.kind === 'planks' ? sf.tones[0] : sf.base;
  const d = (a, b) => Math.hypot(...hexRgb(a).map((v, i) => v - hexRgb(b)[i]));
  return ['mine', 'rival'].filter(t => d(teamGlow(t), ground) < 80 && d(kits[t].ring, ground) < 120);
}
function surfaceClashNote() {
  const c = surfaceClash(); if (!c.length) return '';
  const who = c.length === 2 ? 'Los dos equipos se confunden' : c[0] === 'mine' ? 'Mi equipo se confunde' : 'El rival se confunde';
  return `<p class="clash">${who} con ${surfById(surface).name.toLowerCase()}. Cambia el color o la superficie.</p>`;
}
function kitsClash() {
  const d = (a, b) => Math.hypot(...hexRgb(a).map((v, i) => v - hexRgb(b)[i]));
  return d(teamGlow('mine'), teamGlow('rival')) < 90;
}

let state = buildPlay('ayuda');
let result = null;
const history = [];

const byId = (st, id) => st.players.find(p => p.id === id);
const meOf = st => byId(st, st.meId);
function ballPos(st) {
  if (st.ball.ownerId) {
    const o = byId(st, st.ball.ownerId);
    const f = facingOf(o);
    return V.add(o.pos, V.mul(f, 0.62));
  }
  return st.ball.pos;
}
function facingOf(p) {
  const v = velOf(p);
  if (V.len(v) > 0.2) return V.unit(v);
  if (p.dir && V.len(p.dir) > 0.1) return V.unit(p.dir);
  return { x: 0, y: p.team === 'mine' ? 1 : -1 };
}

/* =========================================================
   Física: tiempo de llegada
   ========================================================= */
function velOf(p) { return p.vel ? p.vel : V.mul(p.dir, CONFIG.speeds[p.speed]); }
function intens(p) { return CONFIG.intensity[p.intensity]; }

function timeToReach(p, pt, reactOverride) {
  if (p.gk) {
    const gy = p.team === 'rival' ? 40 : 0;
    if (Math.abs(pt.y - gy) > CONFIG.gkMaxOut) return Infinity;
  }
  const I = intens(p), v = velOf(p), react = reactOverride ?? I.react;
  const r = { x: p.pos.x + v.x * react, y: p.pos.y + v.y * react };
  const d = Math.hypot(pt.x - r.x, pt.y - r.y);
  const vmax = I.vmax * (p.hasBall ? CONFIG.dribbleFactor : 1);
  let t = react + d / vmax;
  if (d > 0.3) {
    const v0 = Math.max(0, (v.x * (pt.x - r.x) + v.y * (pt.y - r.y)) / d);
    t += Math.max(0, vmax - v0) / (2 * CONFIG.accel);
  }
  return t;
}

/* =========================================================
   Motor de análisis
   ========================================================= */
const logistic = m => 1 / (1 + Math.exp(-CONFIG.logisticK * m));
function goalAngle(x, y) { return Math.abs(Math.atan2(11.5 - x, 40 - y) - Math.atan2(8.5 - x, 40 - y)); }
function posValue(team, pt) {
  const y = team === 'mine' ? pt.y : 40 - pt.y, x = pt.x;
  const d = Math.hypot(x - 10, 40 - y);
  return 0.04 + 0.96 * Math.exp(-d / 9) * (0.55 + 0.45 * Math.min(1, goalAngle(x, y) / 0.6));
}
function lossCost(team, pt) { const y = team === 'mine' ? pt.y : 40 - pt.y; return 0.08 + 0.45 * (1 - y / 40) ** 2; }
const opponents = (st, team) => st.players.filter(q => q.team !== team);
const mates = (st, team) => st.players.filter(q => q.team === team);

function prepare(st) {
  for (const p of st.players) p.hasBall = st.ball.ownerId === p.id;
  return st;
}

function computeMarks(st) {
  // Marca al hombre: parejas rival-atacante de la más cercana a la más lejana, una por cabeza.
  // Si el atacante libre queda a más de 12 m, ese rival defiende su zona.
  const marks = {}, used = new Set(), taken = new Set();
  const att = st.players.filter(p => p.team === 'mine' && !p.gk);
  const riv = st.players.filter(p => p.team === 'rival' && !p.gk);
  const pairs = [];
  for (const r of riv) for (const a of att) pairs.push([V.dist(a.pos, r.pos), r, a]);
  pairs.sort((x, y) => x[0] - y[0]);
  for (const [d, r, a] of pairs) {
    if (used.has(r.id) || taken.has(a.id) || d > 12) continue;
    marks[r.id] = a.id; used.add(r.id); taken.add(a.id);
  }
  return marks;
}

function leadPoint(recv, from) {
  const v = velOf(recv);
  if (V.len(v) < 0.1) return { ...recv.pos };
  let est = V.dist(from, recv.pos) / CONFIG.passSpeed + CONFIG.kickPrep, pt = recv.pos;
  for (let i = 0; i < 2; i++) { pt = V.add(recv.pos, V.mul(v, Math.min(est, 1.4))); est = V.dist(from, pt) / CONFIG.passSpeed + CONFIG.kickPrep; }
  return clampPitch(pt, 0.8);
}

function evalPass(team, from, recv, to, opp, opts = {}) {
  const D = V.dist(from, to);
  if (D < 1.2 || D > CONFIG.maxPass) return null;
  const flight = D / CONFIG.passSpeed;
  const tStart = opts.tStart ?? CONFIG.kickPrep;
  const recvT = opts.recvTime ?? timeToReach(recv, to);
  const tBall = tStart + flight, tRecv = Math.max(recvT, tBall);
  let worstLine = Infinity, ip = null, lineWho = null;
  for (let s = 1; s < D - 0.6; s += 0.5) {
    const k = s / D, pt = { x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k };
    const tb = tStart + s / CONFIG.passSpeed;
    for (const o of opp) {
      const m = timeToReach(o, pt) - tb - CONFIG.interceptMargin;
      if (m < worstLine) { worstLine = m; ip = pt; lineWho = o; }
    }
  }
  let destMin = Infinity, destWho = null;
  for (const o of opp) { const t = timeToReach(o, to); if (t < destMin) { destMin = t; destWho = o; } }
  const mDest = destMin - tRecv;
  const worst = Math.min(worstLine, mDest);
  const p = logistic(worst);
  const facing = V.dot(V.unit(velOf(recv)), { x: 0, y: team === 'mine' ? 1 : -1 }) > 0.4 ? 1.12 : 1;
  const val = posValue(team, to) * facing;
  const lineWorse = worstLine < mDest;
  const score = p * val - (1 - p) * lossCost(team, lineWorse ? ip : to);
  return { kind: 'pase', from, to, recv, D, flight, tStart, tRecv, p, val, score, worstLine, mDest, adv: mDest,
           ip: lineWorse ? ip : to, cutter: lineWorse ? lineWho : destWho };
}

function evalShot(team, from, opp) {
  const gy = team === 'mine' ? 40 : 0;
  const d = Math.hypot(from.x - 10, gy - from.y);
  if (d > CONFIG.shotRange) return null;
  const yy = team === 'mine' ? from.y : 40 - from.y;
  let p = 0.92 * Math.exp(-d / 7.5) * Math.min(1, goalAngle(from.x, yy) / 0.45);
  const blockers = [];
  const post1 = { x: 8.5, y: gy }, post2 = { x: 11.5, y: gy };
  for (const o of opp) {
    if (o.gk) continue;
    if (inTriangle(o.pos, from, post1, post2) || segDist(o.pos, from, { x: 10, y: gy }) < 0.9) { p *= 0.55; blockers.push(o); }
  }
  const gk = opp.find(o => o.gk);
  if (gk) {
    if (segDist(gk.pos, from, { x: 10, y: gy }) < 1) p *= 0.7;
    if (V.dist(gk.pos, from) < 2.5) p *= 0.6;
  }
  const to = { x: gk ? (gk.pos.x < 10 ? 11.05 : 8.95) : 10, y: gy };
  return { kind: 'tiro', from, to, p, val: 1, score: p - (1 - p) * 0.04, D: d, blockers, adv: null };
}

function evalDribbles(team, carrier, opp) {
  const out = [], I = intens(carrier);
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, u = { x: Math.sin(a), y: Math.cos(a) };
    const to = clampPitch(V.add(carrier.pos, V.mul(u, CONFIG.dribbleDist)), 0.8);
    const D = V.dist(to, carrier.pos);
    if (D < 2) continue;
    const myT = D / (I.vmax * CONFIG.dribbleFactor) + 0.15;
    const mid = V.lerp(carrier.pos, to, 0.5);
    let m = Infinity, who = null;
    for (const o of opp) { const mm = Math.min(timeToReach(o, to) - myT, timeToReach(o, mid) - myT * 0.5); if (mm < m) { m = mm; who = o; } }
    const p = logistic(m - 0.1), val = posValue(team, to);
    out.push({ kind: 'conduccion', from: carrier.pos, to, p, val, score: p * val - (1 - p) * lossCost(team, to), D, adv: m, cutter: who, myT });
  }
  return out;
}

function evalHold(team, carrier, opp) {
  let m = Infinity, who = null;
  for (const o of opp) { const t = timeToReach(o, carrier.pos); if (t < m) { m = t; who = o; } }
  const p = logistic(m - 0.5), val = posValue(team, carrier.pos) * CONFIG.holdFactor;
  return { kind: 'proteger', from: carrier.pos, to: carrier.pos, p, val, score: p * val - (1 - p) * lossCost(team, carrier.pos) * 0.8, D: 0, adv: m - 0.5, cutter: who };
}

/* Opciones del que tiene la pelota. full = incluye pases al espacio y conducción. */
function carrierOptions(st, carrier, opts = {}) {
  const team = carrier.team, from = ballPos(st);
  const opp = opts.opp || opponents(st, team);
  const team8 = mates(st, team).filter(t => t.id !== carrier.id);
  const out = [];
  for (const t of team8) {
    if (t.gk && team8.some(x => !x.gk)) continue;
    const lp = t.id === opts.overrideId ? opts.overrideTo : leadPoint(t, from);
    const o = evalPass(team, from, t, lp, opp, t.id === opts.overrideId ? opts.overrideOpts : {});
    if (o) out.push(o);
  }
  if (opts.full) {
    const step = CONFIG.offball.spaceGrid;
    for (let x = 1; x < 20; x += step) for (let y = 1; y < 40; y += step) {
      const pt = { x, y };
      if (V.dist(pt, from) > CONFIG.maxPass || V.dist(pt, from) < 4) continue;
      let bt = Infinity, br = null;
      for (const t of team8) { if (t.gk) continue; const tt = timeToReach(t, pt); if (tt < bt) { bt = tt; br = t; } }
      let rt = Infinity;
      for (const o of opp) rt = Math.min(rt, timeToReach(o, pt));
      if (!br || bt >= rt) continue;
      const o = evalPass(team, from, br, pt, opp);
      if (o && V.dist(pt, leadPoint(br, from)) > 2.5) { o.kind = 'espacio'; out.push(o); }
    }
    out.push(...evalDribbles(team, carrier, opp));
  }
  const sh = evalShot(team, from, opp); if (sh) out.push(sh);
  out.push(evalHold(team, carrier, opp));
  for (const o of out) o.actor = carrier;
  return out;
}
const bestOf = arr => arr.reduce((b, o) => (!b || o.score > b.score ? o : b), null);
const familyOf = o => (o.kind === 'pase' || o.kind === 'espacio' ? 'pase' : o.kind);

/* ---------- Reglas fijas (provisionales) ---------- */
const RULES = [
  {
    id: 'R1', nombre: 'Solo ante el portero', modo: 'con',
    condicion: ({ st, me }) => {
      const d = Math.hypot(me.pos.x - 10, 40 - me.pos.y);
      if (d >= CONFIG.aloneShotDist) return false;
      return !opponents(st, 'mine').some(o => !o.gk && (inTriangle(o.pos, me.pos, { x: 8, y: 40 }, { x: 12, y: 40 }) || V.dist(o.pos, me.pos) < 2.5));
    },
    accion: ({ st, me }) => evalShot('mine', ballPos(st), opponents(st, 'mine')),
  },
  {
    id: 'R4', nombre: 'Arrastra la marca', modo: 'sin',
    condicion: ({ st, me, marker }) => {
      if (!marker || V.dist(marker.pos, me.pos) > 2.5) return false;
      const mv = velOf(marker), myv = velOf(me);
      if (V.len(mv) < 1 || V.len(myv) < 1 || V.dot(V.unit(mv), V.unit(myv)) < 0.5) return false;
      return mates(st, 'mine').some(t => t.id !== me.id && !t.gk && t.pos.y < me.pos.y && V.dist(t.pos, me.pos) < 9);
    },
    accion: ({ me }) => clampPitch({ x: me.pos.x + (me.pos.x < 10 ? -4 : 4), y: me.pos.y + 1 }, 0.8),
  },
  {
    id: 'R6', nombre: 'Presiona si llegas antes', modo: 'def',
    condicion: ({ st, me, carrier }) => {
      const field = mates(st, 'mine').filter(p => !p.gk);
      const tMe = timeToReach(me, carrier.pos);
      return field.every(p => p.id === me.id || timeToReach(p, carrier.pos) >= tMe) && tMe < 1.3;
    },
    accion: ({ carrier }) => clampPitch(V.add(carrier.pos, { x: 0, y: 1 }), 0.6),
  },
];

/* ---------- Análisis principal ---------- */
function detectMode(st) {
  const o = st.ball.ownerId ? byId(st, st.ball.ownerId) : null;
  if (!o) return 'suelta';
  if (o.id === st.meId) return 'con';
  return o.team === 'mine' ? 'sin' : 'def';
}

function analyze(stIn) {
  const st = prepare(stIn);
  const mode = detectMode(st);
  const me = meOf(st);
  if (mode === 'con') return analyzeWithBall(st, me);
  if (mode === 'sin') return analyzeOffBall(st, me, byId(st, st.ball.ownerId));
  if (mode === 'def') return analyzeDefense(st, me, byId(st, st.ball.ownerId));
  return analyzeLoose(st, me);
}

function dirPhrase(from, to) {
  const u = V.unit(V.sub(to, from));
  const side = to.x > 14 ? 'por la banda derecha' : to.x < 6 ? 'por la banda izquierda' : (u.x > 0.35 ? 'hacia la derecha' : u.x < -0.35 ? 'hacia la izquierda' : 'por el centro');
  if (u.y > 0.35) return (Math.abs(u.x) > 0.35 ? 'en diagonal ' : 'al frente ') + side;
  if (u.y < -0.35) return 'hacia atrás ' + side;
  return side;
}
const risk = p => p >= 0.75 ? ['Bajo', 'good'] : p >= 0.5 ? ['Medio', 'mid'] : ['Alto', 'bad'];
const N = p => p ? 'el ' + p.number + (p.team === 'rival' ? ' rival' : '') : 'nadie';

function analyzeOffBall(st, me, carrier) {
  const from = ballPos(st);
  const opp = opponents(st, 'mine');
  const marks = computeMarks(st);
  const markers = opp.filter(o => marks[o.id] === me.id).sort((a, b) => V.dist(a.pos, me.pos) - V.dist(b.pos, me.pos));
  const marker = markers[0] || null;

  // Regla R4
  const r4 = RULES.find(r => r.modo === 'sin');
  const ctx = { st, me, marker, carrier };

  const base = bestOf(carrierOptions(st, carrier, { opp }));
  const baseMe = carrierOptions(st, carrier, { opp }).find(o => o.recv && o.recv.id === me.id);
  const I = intens(me), R = I.vmax * CONFIG.offball.maxT + 1;
  const cands = [];
  for (let gx = 0.5; gx < 20; gx += CONFIG.offball.grid) for (let gy = 0.5; gy < 40; gy += CONFIG.offball.grid) {
    const c = { x: gx, y: gy };
    if (V.dist(c, me.pos) > R) continue;
    if (st.players.some(p => p.id !== me.id && V.dist(p.pos, c) < 1.3)) continue;
    const tc = timeToReach(me, c, 0);   // yo decido: sin tiempo de reacción
    if (tc > CONFIG.offball.maxT) continue;
    const run = V.unit(V.sub(c, me.pos));
    const meV = { ...me, pos: c, vel: V.mul(run.x || run.y ? run : facingOf(me), 3) };
    let markerV = null, oppV = opp;
    if (marker) {
      const goalSide = V.add(c, V.mul(V.unit(V.sub({ x: 10, y: 40 }, c)), 1.2));
      const Im = intens(marker), reach = Math.max(0, tc - Im.react) * Im.vmax;
      markerV = { ...marker, pos: V.toward(marker.pos, goalSide, reach), vel: V.mul(V.unit(V.sub(goalSide, marker.pos)), 4) };
      oppV = opp.map(o => (o === marker ? markerV : o));
    }
    const D = V.dist(from, c);
    const tStart = Math.max(CONFIG.kickPrep, tc - D / CONFIG.passSpeed);
    const pm = evalPass('mine', from, meV, c, opp, { tStart, recvTime: tc });
    let best = pm ? { score: pm.score, who: me, opt: pm } : { score: -Infinity, who: null, opt: null };
    for (const t of mates(st, 'mine')) {
      if (t.id === carrier.id || t.id === me.id || t.gk) continue;
      const o = evalPass('mine', from, t, leadPoint(t, from), oppV);
      if (o && o.score > best.score) best = { score: o.score, who: t, opt: o };
    }
    const sh = evalShot('mine', from, oppV); if (sh && sh.score > best.score) best = { score: sh.score, who: null, opt: sh };
    const gain = best.score - base.score - CONFIG.offball.effortCost * tc;
    cands.push({ c, tc, gain, best, pm, markerV });
  }
  cands.sort((a, b) => b.gain - a.gain);
  // Histéresis al arrastrar: si el punto anterior sigue casi igual de bueno, no saltes a otro.
  if (stickyPt && cands.length) {
    const keep = cands.find(k => V.dist(k.c, stickyPt) < 0.6);
    if (keep && keep !== cands[0] && keep.gain >= cands[0].gain - 0.006) { cands.splice(cands.indexOf(keep), 1); cands.unshift(keep); }
  }
  const typeOf = k => !k.best.who ? 'quieto' : k.best.who.id === me.id ? (k.c.y > from.y + 1.5 ? 'espacio' : 'apoyo') : 'jalar';

  let top = cands[0], kind = top ? typeOf(top) : 'quieto', ruleHit = null;
  if (r4.condicion(ctx)) {
    const tgt = r4.accion(ctx);
    top = cands.reduce((b, k) => (!b || V.dist(k.c, tgt) < V.dist(b.c, tgt) ? k : b), null) || top;
    kind = 'jalar'; ruleHit = r4;
  }
  if (!top || (!ruleHit && top.gain < CONFIG.offball.minGain)) {
    top = { c: { ...me.pos }, tc: 0, gain: 0, best: { who: baseMe ? me : null, opt: baseMe || base }, pm: baseMe, markerV: null };
    kind = 'quieto';
  }
  const alt = cands.find(k => typeOf(k) !== kind && k.gain > 0 && V.dist(k.c, top.c) > 3);
  const tempting = cands.filter(k => k.pm && k.pm.p < 0.42 && posValue('mine', k.c) > posValue('mine', me.pos) + 0.02)
                        .sort((a, b) => posValue('mine', b.c) - posValue('mine', a.c))[0];

  const opt = top.best.opt, recvOpt = top.pm;
  const rec = { mode: 'sin', kind, tag: ruleHit ? 'Regla' : 'Cálculo', ruleName: ruleHit?.nombre,
    me, carrier, target: top.c, t: top.tc, marker, markerTo: top.markerV?.pos, from,
    pass: opt && opt.kind !== 'tiro' && opt.kind !== 'proteger' ? opt : null, beneficiary: top.best.who && top.best.who.id !== me.id ? top.best.who : null,
    alt: alt ? { target: alt.c, kind: typeOf(alt) } : null,
    avoid: tempting ? { target: tempting.c, ip: tempting.pm.ip, cutter: tempting.pm.cutter } : null };

  const runD = V.dist(me.pos, top.c);
  if (kind === 'espacio' || kind === 'apoyo') {
    const cut = recvOpt.cutter;
    rec.title = kind === 'espacio' ? 'Desmárcate al espacio' : 'Ofrece apoyo';
    rec.sub = dirPhrase(me.pos, top.c);
    rec.why = `${cap(N(carrier))} tiene la pelota. Si arrancas ${dirPhrase(me.pos, top.c)} llegas en ${fmt(top.tc)} s, ` +
      (recvOpt.mDest > 0 ? `${fmt(recvOpt.mDest)} s antes que ${N(cut)}` : `casi a la par que ${N(cut)}`) + `, y la línea de pase ${recvOpt.p >= 0.75 ? 'queda limpia' : 'queda justa'}.`;
    rec.next = `${cap(N(carrier))} te la pone ${kind === 'espacio' ? 'al espacio' : 'al pie'}; recibes ${V.dot(V.unit(V.sub(top.c, me.pos)), { x: 0, y: 1 }) > 0.3 ? 'de frente a portería' : 'perfilado'}.`;
    rec.stats = [['Ventaja', (recvOpt.mDest >= 0 ? '+' : '') + fmt(recvOpt.mDest) + ' s', recvOpt.mDest > 0.4 ? 'good' : recvOpt.mDest > 0 ? 'mid' : 'bad'],
                 ['Riesgo', ...risk(recvOpt.p)], ['Carrera', fmt(runD, 0) + ' m', '']];
    rec.passTStart = recvOpt.tStart;
  } else if (kind === 'jalar') {
    const b = rec.beneficiary, o = opt;
    const before = carrierOptions(st, carrier, { opp }).find(x => b && x.recv && x.recv.id === b.id);
    rec.title = marker ? `Jala la marca del ${marker.number}` : 'Abre espacio';
    rec.sub = dirPhrase(me.pos, top.c);
    rec.why = marker
      ? `Si te vas ${dirPhrase(me.pos, top.c)}, ${N(marker)} te sigue y se abre el pase al ${b ? b.number : ''}` + (before && o ? ` (${pct(before.p)} → ${pct(o.p)} de éxito).` : '.')
      : `Te llevas la atención y se abre el pase al ${b ? b.number : ''}.`;
    rec.next = b ? `${cap(N(carrier))} juega con el ${b.number} por el hueco que dejas.` : '';
    rec.stats = [['Mejora', '+' + fmt(top.gain * 100, 0) + ' pts', 'good'], ['Riesgo', ...risk(o ? o.p : 0.5)], ['Carrera', fmt(runD, 0) + ' m', '']];
  } else {
    rec.title = 'Quédate, ya estás libre';
    rec.sub = '';
    rec.why = baseMe ? `Desde donde estás, el pase del ${carrier.number} llega con ${pct(baseMe.p)} de éxito. Moverte no mejora la jugada.` : 'Ningún movimiento mejora la jugada ahora.';
    rec.next = '';
    rec.stats = [['Ventaja', baseMe ? fmt(baseMe.mDest) + ' s' : 'sin dato', ''], ['Riesgo', ...(baseMe ? risk(baseMe.p) : ['sin dato', ''])], ['Carrera', '0 m', '']];
  }
  if (rec.alt) rec.altText = { espacio: 'irte al espacio', apoyo: 'bajar a dar apoyo', jalar: 'jalar la marca', quieto: 'quedarte' }[rec.alt.kind] + ' ' + dirPhrase(me.pos, rec.alt.target) + '.';
  if (rec.avoid) rec.avoidText = `meterte ${dirPhrase(me.pos, rec.avoid.target)}: parece buena zona, pero ${N(rec.avoid.cutter)} corta el pase.`;
  return rec;
}

function optTitle(o) {
  switch (o.kind) {
    case 'pase': return `Pase al ${o.recv.number}`;
    case 'espacio': return `Pase al espacio para el ${o.recv.number}`;
    case 'tiro': return 'Tira a portería';
    case 'conduccion': return 'Conduce ' + dirPhrase(o.from, o.to);
    default: return 'Protege la pelota';
  }
}

function analyzeWithBall(st, me) {
  const opp = opponents(st, 'mine');
  const opts = carrierOptions(st, me, { full: true, opp });
  let best = bestOf(opts), tag = 'Cálculo', ruleName = null;
  const r1 = RULES.find(r => r.modo === 'con');
  if (r1.condicion({ st, me })) { best = r1.accion({ st, me }); best.actor = me; tag = 'Regla'; ruleName = r1.nombre; }
  const alt = bestOf(opts.filter(o => familyOf(o) !== familyOf(best)));
  const passes = opts.filter(o => (o.kind === 'pase') && o !== best && o.p < 0.55);
  const avoid = passes.sort((a, b) => (b.val - a.val))[0] || null;
  const rec = { mode: 'con', kind: best.kind, tag, ruleName, me, option: best, target: best.to, from: best.from, alt, avoid };
  rec.title = optTitle(best);
  rec.sub = '';
  const d = fmt(best.D || 0, 0) + ' m';
  if (best.kind === 'tiro') {
    rec.why = `Estás a ${fmt(best.D, 0)} m. ${best.blockers.length ? 'Hay ' + best.blockers.length + ' rival en la línea, pero' : 'Nadie tapa el tiro y'} el portero deja el palo ${best.to.x > 10 ? 'derecho' : 'izquierdo'}.`;
    rec.stats = [['Gol', pct(best.p), best.p > 0.35 ? 'good' : 'mid'], ['Riesgo', 'Bajo', 'good'], ['Distancia', d, '']];
  } else if (best.kind === 'pase' || best.kind === 'espacio') {
    rec.why = `${cap(N(best.recv))} ${V.len(velOf(best.recv)) > 2 ? 'ya va en ' + CONFIG.speedLabel[best.recv.speed || 'media'].toLowerCase() : 'está libre'} y llega ${fmt(Math.max(0, best.mDest))} s antes que ${N(best.cutter)}.`;
    rec.stats = [['Ventaja', (best.mDest >= 0 ? '+' : '') + fmt(best.mDest) + ' s', best.mDest > 0.4 ? 'good' : best.mDest > 0 ? 'mid' : 'bad'], ['Riesgo', ...risk(best.p)], ['Pase', d, '']];
  } else if (best.kind === 'conduccion') {
    rec.why = `Hay espacio: le sacas ${fmt(Math.max(0, best.adv))} s ${N(best.cutter).replace(/^el /, 'al ')} si avanzas ${fmt(best.D, 0)} m con la pelota.`;
    rec.stats = [['Ventaja', '+' + fmt(Math.max(0, best.adv)) + ' s', 'good'], ['Riesgo', ...risk(best.p)], ['Conducción', d, '']];
  } else {
    rec.why = 'No hay pase limpio ni espacio. Cubre la pelota y espera a que alguien se desmarque.';
    rec.stats = [['Margen', fmt(best.adv) + ' s', ''], ['Riesgo', ...risk(best.p)], ['Distancia', '0 m', '']];
  }
  rec.next = 'Después, sigue la jugada y ofrece una nueva línea de pase.';
  if (alt) rec.altText = optTitle(alt).toLowerCase() + ` (${pct(alt.p)} de éxito).`;
  if (avoid) rec.avoidText = `${optTitle(avoid).toLowerCase()}: ${N(avoid.cutter)} lo corta.`;
  return rec;
}

function analyzeDefense(st, me, carrier) {
  const r6 = RULES.find(r => r.modo === 'def');
  const field = mates(st, 'mine').filter(p => !p.gk);
  const rivals = st.players.filter(p => p.team === 'rival' && !p.gk);
  // reparto de marcas: cada uno de los míos al rival más cercano libre
  const assign = []; const used = new Set();
  for (const p of [...field].sort((a, b) => V.dist(a.pos, carrier.pos) - V.dist(b.pos, carrier.pos))) {
    let best = null, bd = Infinity;
    for (const r of rivals) { if (used.has(r.id)) continue; const d = V.dist(p.pos, r.pos); if (d < bd) { bd = d; best = r; } }
    if (best) { used.add(best.id); assign.push([p, best]); }
  }
  const rec = { mode: 'def', me, carrier, assign, tag: 'Cálculo' };
  if (r6.condicion({ st, me, carrier })) {
    rec.kind = 'presion'; rec.tag = 'Regla'; rec.ruleName = r6.nombre; rec.target = r6.accion({ carrier });
    rec.t = timeToReach(me, rec.target);
    rec.title = `Presiona al ${carrier.number}`;
    rec.why = `Eres el más cercano: llegas en ${fmt(rec.t)} s, antes de que controle. Entra por dentro para cerrar el pase al centro.`;
    rec.stats = [['Llegas', fmt(rec.t) + ' s', 'good'], ['Riesgo', 'Medio', 'mid'], ['Carrera', fmt(V.dist(me.pos, rec.target), 0) + ' m', '']];
  } else {
    const opp = opponents(st, 'rival');
    const options = carrierOptions(st, carrier, { opp }).filter(o => o.kind === 'pase');
    const danger = bestOf(options);
    if (danger) {
      let bestPt = null, bm = Infinity;
      for (let f = 0.2; f <= 0.8; f += 0.1) {
        const pt = V.lerp(danger.from, danger.to, f);
        const m = timeToReach(me, pt) - (danger.tStart + V.dist(danger.from, pt) / CONFIG.passSpeed);
        if (m < bm) { bm = m; bestPt = pt; }
      }
      rec.kind = 'linea'; rec.target = bestPt; rec.danger = danger; rec.t = timeToReach(me, bestPt);
      rec.title = `Cierra el pase al ${danger.recv.number}`;
      rec.why = `Es la mejor opción del ${carrier.number} (${pct(danger.p)} de éxito). Ponte en la línea ${dirPhrase(me.pos, bestPt)} y se la quitas.`;
      rec.stats = [['Llegas', fmt(rec.t) + ' s', bm < 0 ? 'good' : 'mid'], ['Su pase', pct(danger.p), 'bad'], ['Carrera', fmt(V.dist(me.pos, bestPt), 0) + ' m', '']];
    } else {
      rec.kind = 'temporiza'; rec.target = clampPitch(V.add(me.pos, { x: 0, y: -2 })); rec.t = timeToReach(me, rec.target);
      rec.title = 'Temporiza'; rec.why = 'Recula hacia tu área y espera el error.'; rec.stats = [['Llegas', fmt(rec.t) + ' s', ''], ['Riesgo', 'Bajo', 'good'], ['Carrera', '2 m', '']];
    }
  }
  rec.next = 'Vuelve a tu marca en cuanto se juegue la pelota.';
  rec.sub = '';
  return rec;
}

function analyzeLoose(st, me) {
  const bp = st.ball.pos;
  let first = null, ft = Infinity;
  for (const p of st.players) { const t = timeToReach(p, bp); if (t < ft) { ft = t; first = p; } }
  const tMe = timeToReach(me, bp);
  const rec = { mode: 'suelta', me, target: bp, t: tMe, tag: 'Cálculo', sub: '' };
  let rv = Infinity, rw = null; for (const o of opponents(st, 'mine')) { const t = timeToReach(o, bp); if (t < rv) { rv = t; rw = o; } }
  if (first.team === 'mine' && first.id === me.id) {
    rec.kind = 'vepor'; rec.title = 'Ve por la pelota';
    rec.why = `Llegas en ${fmt(tMe)} s, ${fmt(rv - tMe)} s antes que ${N(rw)}.`;
  } else if (first.team === 'mine') {
    rec.kind = 'apoyo'; rec.title = `Llega el ${first.number}: acompaña`;
    rec.target = clampPitch(V.add(bp, { x: me.pos.x > bp.x ? 4 : -4, y: 3 }), 0.8); rec.t = timeToReach(me, rec.target);
    rec.why = `El ${first.number} llega primero (${fmt(ft)} s). Ofrécete adelante para el siguiente pase.`;
  } else {
    rec.kind = 'vepor'; rec.title = 'Disputa la pelota';
    rec.why = `${cap(N(first))} llega antes (${fmt(ft)} s contra tus ${fmt(tMe)} s). Ve a cerrarle el paso.`;
  }
  rec.stats = [['Llegas', fmt(rec.t) + ' s', ''], ['Rival', fmt(rv) + ' s', ''], ['Carrera', fmt(V.dist(me.pos, rec.target), 0) + ' m', '']];
  rec.next = '';
  return rec;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* =========================================================
   Simulación para "Animar"
   ========================================================= */
function nearestSpeed(v) {
  let best = 'parado', bd = Infinity;
  for (const k of CONFIG.speedOrder) { const d = Math.abs(CONFIG.speeds[k] - v); if (d < bd) { bd = d; best = k; } }
  return best;
}

function simulate(st0, rec0) {
  const C = CONFIG.sim, dt = C.dt;
  prepare(st0);
  const S = { t: 0, meId: st0.meId };
  S.players = st0.players.map(p => ({ id: p.id, team: p.team, number: p.number, gk: p.gk, intensity: p.intensity, dir: { ...p.dir }, speed: p.speed,

    }

    frames.push({
      t: S.t,
      P: S.players.map(p => [p.pos.x, p.pos.y]),
      b: [ball.pos.x, ball.pos.y],
      fl: ball.state === 'flight' ? { from: ball.from, to: ball.to, kind: ball.kind, t0: ball.t0 } : null,
      owner: ball.state === 'owned' ? ball.owner : null,
      meT: me.target ? { ...me.target } : null,

}

/* Dibuja la superficie elegida debajo de las líneas; la nueva entra fundiéndose sobre la anterior (240 ms). */

/* --- capa de recomendación: huellas de tachones, cono, pase rodando --- */
let recKey = '';
function quadPts(a, b, bend, n = 40) {
  const m = V.lerp(a, b, 0.5), nn = V.unit({ x: -(b.y - a.y), y: b.x - a.x }), c = V.add(m, V.mul(nn, bend));
  const out = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push({ x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }); }
  return out;
}
function footprints(g, from, to, animate) {
  g.innerHTML = '';

  if (D < 1.2) return 0;
  const pts = quadPts(from, to, Math.min(1.2, D * 0.1) * (to.x > from.x ? -1 : 1));
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + V.dist(pts[i - 1], pts[i]));
  const total = cum[cum.length - 1], stride = 0.78;
  let k = 0;
  for (let s = 1.05; s < total - 0.85; s += stride, k++) {
    let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
    const f = (s - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
    const p = V.lerp(pts[i - 1], pts[i], f), d = V.unit(V.sub(pts[i], pts[i - 1])), n = { x: -d.y, y: d.x };
    const side = k % 2 ? 1 : -1, c = V.add(p, V.mul(n, side * 0.2));
    const ang = Math.atan2(-d.y, d.x) * 180 / Math.PI + 90;
    const fp = el('g', { transform: `translate(${c.x.toFixed(3)} ${SY(c.y).toFixed(3)}) rotate(${ang.toFixed(1)})` }, g);
    const inner = el('g', { class: animate ? 'step' : '' }, fp);
    if (animate) inner.style.animationDelay = (k * 45) + 'ms';
    el('ellipse', { cx: 0, cy: -0.08, rx: 0.17, ry: 0.27, fill: 'var(--cone)', stroke: 'rgba(20,10,0,.45)', 'stroke-width': 0.04, opacity: 0.95 }, inner);
    el('ellipse', { cx: 0, cy: 0.3, rx: 0.13, ry: 0.11, fill: 'var(--cone)', stroke: 'rgba(20,10,0,.45)', 'stroke-width': 0.04, opacity: 0.95 }, inner);
  }
  return k;
}
function buildCone(parent, label) {
  const g = el('g', {}, parent);
  const body = el('g', {}, g);
  el('rect', { x: -0.56, y: -0.56, width: 1.12, height: 1.12, rx: 0.2, fill: '#d97a00' }, body);
  el('circle', { r: 0.43, fill: 'var(--cone)' }, body);
  el('circle', { r: 0.28, fill: 'none', stroke: '#fff6ea', 'stroke-width': 0.1 }, body);
  el('circle', { r: 0.12, fill: '#ffc68a' }, body);
  if (!label) return { g, body };
  const chip = el('g', { class: 'svgchip', transform: 'translate(0 -1.45)' }, body);
  const w = label.length * 0.36 + 0.8;
  el('rect', { x: -w / 2, y: -0.45, width: w, height: 0.9, rx: 0.45, fill: 'rgba(36,36,38,.92)' }, chip);
  const t = el('text', { 'text-anchor': 'middle', style: 'text-anchor:middle', fill: '#fff' }, chip); t.textContent = label;
  return { g, body };
}

let geo = null, shownPt = null, goalPt = null, followRaf = 0, followLast = 0;
function renderRec(animate) {
  const g = $('#rec'); g.innerHTML = '';

  const gm = $('#marks'); gm.innerHTML = '';
  const r = result; geo = null;

  const me = meOf(state);
  const key = [r.mode, r.kind, Math.round(r.target?.x / 1.5), Math.round(r.target?.y / 1.5), r.option?.recv?.id || r.beneficiary?.id || ''].join('|');
  const doDraw = animate && key !== recKey && !reduceMotion.matches;
  recKey = key;

  if (r.mode === 'def') for (const [a, b] of r.assign) el('line', { x1: a.pos.x, y1: SY(a.pos.y), x2: b.pos.x, y2: SY(b.pos.y), stroke: 'rgba(255,255,255,.38)', 'stroke-width': 0.07, 'stroke-dasharray': '.25 .22', 'stroke-linecap': 'round' }, gm);

  if (r.mode === 'sin' && r.kind === 'jalar' && r.marker && r.markerTo) {
    el('path', { d: `M${pt(r.marker.pos)} L${pt(r.markerTo)}`, stroke: 'rgba(255,255,255,.7)', 'stroke-width': 0.08, 'stroke-dasharray': '.2 .2', fill: 'none' }, g);
    if (r.pass) { const m = V.lerp(r.pass.from, r.pass.to, 0.55); el('circle', { cx: m.x, cy: SY(m.y), r: 2.2, fill: 'rgba(255,159,10,.1)', stroke: 'rgba(255,159,10,.4)', 'stroke-width': 0.06 }, g); }
  }
  if (r.mode === 'con' && r.kind === 'proteger') el('circle', { cx: me.pos.x, cy: SY(me.pos.y), r: 1.8, fill: 'none', stroke: 'var(--cone)', 'stroke-width': 0.1, 'stroke-dasharray': '.4 .3' }, g);

  const passOn = (r.mode === 'sin' && r.pass && r.kind !== 'quieto') || (r.mode === 'con' && ['pase', 'espacio', 'tiro'].includes(r.kind));
  const passFollows = r.mode === 'con' || (r.mode === 'sin' && r.kind !== 'jalar');
  const moving = !!r.target && V.dist(me.pos, r.target) > 0.8 && !(r.mode === 'con' && r.kind !== 'conduccion');

    if (doDraw) geo.pass.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: 'ease' });
  }
  geo.steps = moving ? el('g', {}, g) : null;
  if (showCone) {
    const label = r.mode === 'sin' ? (r.kind === 'quieto' ? 'Aquí estás bien' : 'Ponte aquí') : r.mode === 'def' ? (r.kind === 'presion' ? 'Presiona' : 'Cierra aquí') : 'Ve aquí';

    { duration: 300, delay: nSteps * 45 + 40, easing: 'cubic-bezier(0.34, 1.36, 0.64, 1)', fill: 'backwards' });

}
function applyGeo(t, animateSteps = false) {

  let n = 0;

  if (geo.pass) geo.pass.setAttribute('d', `M${pt(geo.passFrom)} L${pt(geo.passTo || t)}`);

/* --- ciclo de cambio --- */
let pending = 0, stickyPt = null;
function changed(animate) {
  cancelAnimationFrame(pending);
  pending = requestAnimationFrame(() => {
    result = analyze(state);
    renderKits();
    if (slide) {
      // mientras las fichas se deslizan, la recomendación espera a que lleguen
      renderPlayers(slide.cur); renderBall(slide.ballCur, false);
      for (const id of ['#rec', '#coneL', '#marks']) $(id).innerHTML = '';
      geo = null; recKey = '';
    } else {
      renderPlayers();
      renderBall(ballDrawPos(state), picking);
      renderRec(animate);
    }
    renderZones();

}
function pushHistory() { history.push(JSON.stringify(state)); if (history.length > 30) history.shift(); }

/* --- cambio de jugada: cada ficha va a su sitio con un muelle críticamente amortiguado (respuesta 0,4 s, sin rebote).
   Si se elige otra jugada a medio camino, sale desde donde está y con la velocidad que lleva. --- */
let slide = null, slideRaf = 0;
const SLIDE_W = 2 * Math.PI / 0.4;
function goToPlay(id) {
  if (playback) { playback = null; setDim(false); $('#expo').innerHTML = ''; }
  if (picking) { picking = false; $('#stage').classList.remove('picking'); }
  const cur = {}, vel = {};
  for (const p of state.players) { cur[p.id] = slide ? slide.cur[p.id] : { ...p.pos }; vel[p.id] = slide ? slide.vel[p.id] : { x: 0, y: 0 }; }
  const ballCur = slide ? slide.ballCur : { ...ballDrawPos(state) }, ballVel = slide ? slide.ballVel : { x: 0, y: 0 };
  pushHistory();
  state = buildPlay(id);
  const me = meOf(state);
  if (reduceMotion.matches) {
    slide = null; changed(true);
    $('#players').animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 200, easing: 'ease' });
    setTimeout(() => toast(me.pos, `Tú eres el <b>${me.number}</b>`), 60);
    return;
  }
  slide = { cur, vel, ballCur, ballVel, last: performance.now() };
  changed(true);
  if (!slideRaf) slideRaf = requestAnimationFrame(slideStep);
}
function slideStep(now) {
  if (!slide) { slideRaf = 0; return; }
  let dt = Math.min(0.05, (now - slide.last) / 1000); slide.last = now;
  const spring = (x, v, to) => {
    for (let h = dt; h > 1e-6; h -= 1 / 120) {
      const s = Math.min(h, 1 / 120);
      const a = { x: -SLIDE_W * SLIDE_W * (x.x - to.x) - 2 * SLIDE_W * v.x, y: -SLIDE_W * SLIDE_W * (x.y - to.y) - 2 * SLIDE_W * v.y };
      v.x += a.x * s; v.y += a.y * s; x.x += v.x * s; x.y += v.y * s;
    }
    return V.dist(x, to) < 0.01 && V.len(v) < 0.05;
  };
  let done = true;
  for (const p of state.players) done = spring(slide.cur[p.id], slide.vel[p.id], p.pos) && done;
  done = spring(slide.ballCur, slide.ballVel, ballDrawPos(state)) && done;
  renderPlayers(slide.cur); renderBall(slide.ballCur, false);
  if (done) { slideRaf = 0; finishSlide(); return; }
  slideRaf = requestAnimationFrame(slideStep);
}
function finishSlide(quiet) {
  if (!slide) return;
  slide = null; cancelAnimationFrame(slideRaf); slideRaf = 0;
  renderPlayers(); renderBall(ballDrawPos(state), picking); renderRec(true);
  if (!quiet) { const me = meOf(state); toast(me.pos, `Tú eres el <b>${me.number}</b>`); }
}

/* =========================================================
   Interacción
   ========================================================= */
const svg = $('#pitch');
let drag = null, picking = false;
function toWorld(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return { x: q.x, y: 40 - q.y };
}
function dismissHint() {
  const h = $('#hint'); if (!h || h.classList.contains('gone')) return;
  h.classList.add('gone');
  try { localStorage.setItem('pambol.hint', '1'); } catch (e) { /* sin almacenamiento */ }
}
svg.addEventListener('pointerdown', e => {
  if (playback || drag) return;            // un solo dedo: ignora toques extra durante el arrastre
  dismissHint();
  finishSlide(true);                        // tocar durante un cambio de jugada lo completa al instante
  const hit = e.target.closest('[data-hit]');
  const w = toWorld(e);
  drag = { kind: hit?.dataset.hit || 'grass', id: hit?.dataset.id, cx: e.clientX, cy: e.clientY, moved: false, before: JSON.stringify(state), w0: w, pid: e.pointerId };
  if (drag.kind === 'ball' && state.ball.ownerId && !picking) { drag.kind = 'player'; drag.id = state.ball.ownerId; drag.fromBall = true; }
  if (drag.kind === 'player' && !picking) {
    const p = byId(state, drag.id); drag.off = V.sub(p.pos, w);

  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
svg.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) < 6) return;
  if (picking && drag.kind !== 'grass') return;
  drag.moved = true;
  const w = toWorld(e);
  if (drag.kind === 'player') {
    const p = byId(state, drag.id);
    p.pos = clampPitch(V.add(w, drag.off), 0.5);
  } else if (drag.kind === 'tip') {
    const p = byId(state, drag.id);
    const v = V.sub(w, p.pos);
    if (V.len(v) > 0.4) p.dir = V.unit(v);
    if (p.speed === 'parado' && V.len(v) > 2) p.speed = 'trote';
  } else if (drag.kind === 'ball' && !state.ball.ownerId) {
    state.ball.pos = clampPitch(w, 0.3);
  } else return;
  liveUpdate();
});
let liveRaf = 0;
function liveUpdate() {
  cancelAnimationFrame(liveRaf);
  liveRaf = requestAnimationFrame(() => {
    renderPlayers(); renderBall(ballDrawPos(state), picking);
    stickyPt = result && result.mode === 'sin' ? result.target : null;
    result = analyze(state);
    stickyPt = null;
    renderRec(false); renderZones(); renderSheet(); renderKits();
  });
}
function endDrag(e) {

  if (d.moved) {
    if (JSON.stringify(state) !== d.before) { history.push(d.before); if (history.length > 30) history.shift(); }
    changed(true);
    return;
  }
  const p = d.id ? byId(state, d.id) : null;
  if (picking) {
    picking = false; $('#stage').classList.remove('picking');
    if (d.kind === 'player' || d.kind === 'tip') {
      if (d.fromBall) { changed(false); return; }
      pushHistory(); state.ball = { ownerId: p.id, pos: null };
      toast(p.pos, p.id === state.meId ? 'La tienes <b>tú</b>' : `Pelota al <b>${p.number}</b>`);
    } else if (d.kind === 'grass') {
      pushHistory(); state.ball = { ownerId: null, pos: clampPitch(d.w0, 0.3) };
      toast(d.w0, 'Pelota <b>suelta</b>');
    }
    changed(true); return;
  }
  if (d.fromBall || d.kind === 'ball') {
    picking = true; $('#stage').classList.add('picking');
    renderBall(ballDrawPos(state), true);
    toast(ballDrawPos(state), 'Toca a quién se la das');
    return;
  }
  if (d.kind === 'player') {
    pushHistory();
    p.intensity = p.intensity % 3 + 1;
    toast(p.pos, `Intensidad <b>${p.intensity}</b>, ${CONFIG.intensity[p.intensity].label.toLowerCase()}`);
    changed(true);
  } else if (d.kind === 'tip') {
    pushHistory();
    const i = CONFIG.speedOrder.indexOf(p.speed);
    p.speed = CONFIG.speedOrder[(i + 1) % 4];
    toast(p.pos, `<b>${CONFIG.speedLabel[p.speed]}</b>${p.speed === 'parado' ? '' : `, ${CONFIG.speeds[p.speed]} m/s`}`);

svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', e => {
  if (!drag || e.pointerId !== drag.pid) return;

});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Escape' && sheetView === 'setup' && !picking) closeSetup();

});
$('#hintOk').onclick = dismissHint;
addEventListener('resize', () => { measurePeek(); });

/* =========================================================
   Reproducción ("Animar"): colas de cometa sobre la cancha a media luz
   ========================================================= */
let playback = null;
/* Cola de cometa: cada jugador arrastra solo su último tramo (0,8 s; la pelota 0,45 s), partido en trozos que se afinan
   y se apagan hacia atrás. Quien corre más deja la cola más larga; quien se para, la recoge. */
const COMET = { players: 0.8, ball: 0.45, pieces: 10 };
function trailColors(p) { const c = p.gk ? GK_COLOR[p.team] : teamGlow(p.team); return [c, mix(c, '#ffffff', 0.55)]; }
function makeComet(parent, glow, core, wGlow, wCore) {
  const g = el('g', {}, parent), segs = [];
  for (let i = 0; i < COMET.pieces; i++) {
    const u = (i + 1) / COMET.pieces, fade = u * u;
    segs.push([
      el('polyline', { fill: 'none', stroke: glow, 'stroke-width': (wGlow * (0.25 + 0.75 * u)).toFixed(3), 'stroke-linejoin': 'round', opacity: (0.5 * fade).toFixed(3) }, g),
      el('polyline', { fill: 'none', stroke: core, 'stroke-width': (wCore * (0.2 + 0.8 * u)).toFixed(3), 'stroke-linejoin': 'round', opacity: (0.95 * fade).toFixed(3) }, g),

  }
  return segs;
}
// pts: de la cola a la cabeza. Cada trozo comparte su primer punto con el anterior para que no queden huecos.
function drawComet(segs, pts) {
  const n = pts.length, P = segs.length;
  for (let i = 0; i < P; i++) {
    const a = Math.floor(i * (n - 1) / P), b = Math.max(a + 1, Math.floor((i + 1) * (n - 1) / P));
    const s = n > 1 ? pts.slice(a, Math.min(n, b + 1)).join(' ') : '';
    segs[i][0].setAttribute('points', s); segs[i][1].setAttribute('points', s);
  }
}
function startPlayback() {
  if (!result) return;
  if (picking) { picking = false; $('#stage').classList.remove('picking'); }
  finishSlide(true);
  cancelAnimationFrame(pending); cancelAnimationFrame(liveRaf);   // un recálculo pendiente no debe pisar la hoja de la repetición
  result = analyze(state);
  const sim = simulate(clone(state), result);
  playback = { sim, t: 0, playing: true, rate: 1, last: performance.now(), lastEv: -1 };
  $('#rec').innerHTML = ''; $('#marks').innerHTML = ''; $('#zones').innerHTML = ''; geo = null;
  const ex = $('#expo'); ex.innerHTML = '';
  playback.trails = {};
  for (const id of sim.order) {
    const [glow, core] = trailColors(byId(state, id));
    playback.trails[id] = makeComet(ex, glow, core, 0.95, 0.21);
  }
  playback.ballTrail = makeComet(ex, '#fff3c8', '#fffdf2', 0.6, 0.15);
  playback.passLine = el('path', { fill: 'none', stroke: 'rgba(255,255,255,.85)', 'stroke-width': 0.2, 'stroke-linecap': 'round', 'stroke-dasharray': '0 .45', class: reduceMotion.matches ? '' : 'roll' }, $('#rec'));
  $('#coneL').innerHTML = '';
  playback.cone = buildCone($('#coneL'), '');

}
function frameAt(t) {
  const fr = playback.sim.frames, x = clamp(t / CONFIG.sim.dt, 0, fr.length - 1), i = Math.floor(x), k = x - i;
  const a = fr[i], b = fr[Math.min(i + 1, fr.length - 1)];

  return { i, f: { ...a, P: a.P.map((p, j) => [L(p[0], b.P[j][0]), L(p[1], b.P[j][1])]), b: ballJump ? a.b : [L(a.b[0], b.b[0]), L(a.b[1], b.b[1])] } };

}

  renderPlayers(positions);
  let bx = f.b[0], by = f.b[1];
  if (f.owner) { const k = pb.sim.order.indexOf(f.owner), o = f.P[k]; bx = o[0] + (bx - o[0]) * 1.75; by = o[1] + (by - o[1]) * 1.75; }

  // cola de cometa: solo el último tramo, que se desvanece hacia atrás
  const from = n => Math.max(0, i - Math.round(n / CONFIG.sim.dt));
  const xy = (x, y) => `${x.toFixed(2)},${SY(y).toFixed(2)}`;
  pb.sim.order.forEach((id, k) => {
    const pts = [];
    for (let j = from(COMET.players); j <= i; j++) pts.push(xy(fr[j].P[k][0], fr[j].P[k][1]));
    pts.push(xy(f.P[k][0], f.P[k][1]));
    drawComet(pb.trails[id], pts);

  const bpts = [];
  for (let j = from(COMET.ball); j <= i; j++) bpts.push(xy(fr[j].b[0], fr[j].b[1]));

  else pb.passLine.style.display = 'none';
  if (f.meT) { pb.cone.g.style.display = ''; pb.cone.g.setAttribute('transform', `translate(${f.meT.x.toFixed(3)} ${SY(f.meT.y).toFixed(3)})`); }
  else pb.cone.g.style.display = 'none';
  const evIdx = pb.sim.events.reduce((k, e, j) => (e.t <= pb.t + 1e-6 ? j : k), 0);
  $('#clock').textContent = '+' + fmt(pb.t);
  const sc = $('#scrub'); sc.value = pb.t; sc.style.setProperty('--p', (pb.t / pb.sim.dur * 100).toFixed(2) + '%');
  if (evIdx !== pb.lastEv) {
    pb.lastEv = evIdx;
    const capEl = $('#cap'); capEl.textContent = pb.sim.events[evIdx].text;
    capEl.classList.remove('in'); void capEl.offsetWidth; capEl.classList.add('in');
    document.querySelectorAll('.evs li').forEach((li, j) => li.classList.toggle('on', j <= evIdx));
  }
}

}
function renderPlaybackSheet() {

  c.innerHTML = `
    <button class="grab" id="bGrab" aria-label="Ver la secuencia" aria-expanded="${sheetOpen}"></button>

      <button class="go" id="bPP"></button>
      <button class="txt" id="bSlow" aria-pressed="false">½×</button>
      <button class="txt" id="bAdopt" title="Seguir la jugada desde este momento" aria-label="Seguir la jugada desde este momento">Desde aquí</button>
      <button class="sq" id="bBack" aria-label="Volver a la jugada" title="Volver a la jugada">${icon('undo')}</button>
    </div>
    <button class="morebtn" id="bMore" aria-expanded="${sheetOpen}">${icon('caret')}${sheetOpen ? 'Menos' : 'La secuencia'}</button>
    <div class="more"><div>
      <ol class="evs">${pb.sim.events.map(e => `<li><span class="num">+${fmt(e.t)}</span>${e.text}</li>`).join('')}</ol>
    </div></div>`;
  syncPlayButton();
  pb.lastEv = -1;
  const toggle = () => { sheetOpen = !sheetOpen; c.classList.toggle('open', sheetOpen); $('#bMore').lastChild.textContent = sheetOpen ? 'Menos' : 'La secuencia'; };
  $('#bGrab').onclick = toggle; $('#bMore').onclick = toggle;
  $('#bPP').onclick = () => {
    if (pb.t >= dur - 0.02) { pb.t = 0; pb.lastEv = -1; }
    pb.playing = !pb.playing; pb.last = performance.now(); syncPlayButton();
  };
  $('#bSlow').onclick = e => { pb.rate = pb.rate === 1 ? 0.5 : 1; e.currentTarget.setAttribute('aria-pressed', pb.rate !== 1); };
  $('#scrub').oninput = e => { pb.t = +e.target.value; pb.playing = false; syncPlayButton(); };
  $('#bBack').onclick = stopPlayback;
  $('#bAdopt').onclick = () => {
    const { f, i } = frameAt(pb.t);
    pushHistory();
    const fr = pb.sim.frames, j = Math.max(0, i - 6);
    pb.sim.order.forEach((id, k) => {
      const p = byId(state, id);
      const v = V.mul(V.sub({ x: f.P[k][0], y: f.P[k][1] }, { x: fr[j].P[k][0], y: fr[j].P[k][1] }), 1 / Math.max(CONFIG.sim.dt, (i - j) * CONFIG.sim.dt));
      p.pos = { x: f.P[k][0], y: f.P[k][1] };
      if (V.len(v) > 0.4) p.dir = V.unit(v);
      p.speed = nearestSpeed(V.len(v));
    });
    state.ball = f.owner ? { ownerId: f.owner, pos: null } : { ownerId: null, pos: { x: f.b[0], y: f.b[1] } };
    if (pb.t >= dur - 1e-6 && pb.sim.final.ball.ownerId) state.ball = { ownerId: pb.sim.final.ball.ownerId, pos: null };
    stopPlayback();
  };
}
function stopPlayback() {
  playback = null;
  setDim(false);
  $('#expo').innerHTML = ''; $('#rec').innerHTML = ''; $('#coneL').innerHTML = '';
  recKey = '';
  changed(true);
}

/* =========================================================
   Arranque
   ========================================================= */
drawField();
buildPlayers();
applyKits();
try { if (localStorage.getItem('pambol.hint')) $('#hint').classList.add('gone'); } catch (e) { /* sin almacenamiento */ }
if (!reduceMotion.matches) {
  Object.values(nodes).forEach(n => { if (n && n.body) { n.body.classList.add('dropin'); n.body.style.animationDelay = (120 + n.i * 35) + 'ms'; } });
  setTimeout(() => Object.values(nodes).forEach(n => { if (n && n.body) { n.body.classList.remove('dropin'); n.body.style.animationDelay = ''; } }), 900);
}
changed(true);
reduceMotion.addEventListener?.('change', () => changed(false));
</script>
</body>
</html>
